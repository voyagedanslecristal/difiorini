"French-Italian, based in Paris ﹒ Fifteen years of experience in luxury creative strategy for high jewellery, gemmology and watchmaking ﹒ Senior expertise in living heritage, history, myths and tales around the art of adornment ﹒ Fluent in French, Italian, English and German — proficient in Ancient Greek.": "Franco-italiana, vive a Parigi ﹒ Quindici anni di esperienza nella strategia creativa del lusso per l'alta gioielleria, la gemmologia e l'orologeria ﹒ Competenza senior nel patrimonio vivente, nella storia, nei miti e nei racconti legati all'arte dell'ornamento ﹒ Parla correntemente francese, italiano, inglese e tedesco — buona conoscenza del greco antico.",
"An Authorial Practice": "Una pratica d'autore",
"Laura-Rachel Dubos di Fiorini is a French-Italian, Paris-based creative and strategic director, art historian, writer, art critic, and visual artist whose work operates at the intersection of art history, jewellery, gemmology, mythology, philosophy, and sociology.\n\nAt the core of her professional activity lies her work for the executive leadership of major luxury Maisons. She operates at the level of strategic direction, developing high-level marketing and communication frameworks grounded in historical depth, cultural legitimacy, and intellectual coherence.\n\nHer practice articulates heritage, material knowledge, and symbolic systems into long-term narratives that shape vision, meaning, and projection, positioning marketing as a central vector of cultural construction within the Maison.": "Laura-Rachel Dubos di Fiorini è una direttrice creativa e strategica franco-italiana con sede a Parigi, storica dell'arte, scrittrice, critica d'arte e artista visiva, il cui lavoro si colloca all'incrocio tra storia dell'arte, gioielleria, gemmologia, mitologia, filosofia e sociologia.\n\nAl centro della sua attività professionale si trova il lavoro svolto per la direzione delle grandi Maison del lusso. Opera al livello della direzione strategica, elaborando quadri di marketing e di comunicazione di alto profilo, fondati sulla profondità storica, sulla legittimità culturale e sulla coerenza intellettuale.\n\nLa sua pratica articola patrimonio, conoscenza dei materiali e sistemi simbolici in narrazioni di lungo periodo che danno forma alla visione, al significato e alla proiezione, facendo del marketing un vettore centrale di costruzione culturale all'interno della Maison.",
"A Scholarly Foundation": "Una formazione accademica",
"Educated at the historically renowned Bauhaus University in art and design, she further specialised in the history and philosophy of art, as well as the history of jewellery and luxury markets, at Sotheby's Institute of Art and Christie's Education.\n\nShe has published art critiques in the Swiss press, offering reflections on contemporary events through the lens of major artworks, material culture, and philosophical thought, and is the author of an essay entitled The Art Island, sur le rite initiatique et la métamorphose engendrée par toute rencontre avec une œuvre d'art.\n\nHer practice spans high-level creative direction, visual creation, writing, and narrative strategy. Working at the crossroads of art and luxury, Laura-Rachel develops cultural and storytelling frameworks for major Maisons, including Cartier, Chopard, and De Beers. Her work is rooted in research-driven storytelling, where marketing is approached as a cultural discipline — one that transmits heritage, meaning, and imagination at the highest level of the luxury ecosystem.": "Formatasi in arte e design alla storica Università del Bauhaus, si è poi specializzata in storia e filosofia dell'arte, nonché in storia del gioiello e dei mercati del lusso, al Sotheby's Institute of Art e a Christie's Education.\n\nHa pubblicato critiche d'arte sulla stampa svizzera, proponendo riflessioni sull'attualità attraverso il prisma di grandi opere, della cultura materiale e del pensiero filosofico, ed è autrice di un saggio intitolato The Art Island, dedicato al rito iniziatico e alla metamorfosi generata da ogni incontro con un'opera d'arte.\n\nLa sua pratica abbraccia la direzione creativa di alto livello, la creazione visiva, la scrittura e la strategia narrativa. All'incrocio tra arte e lusso, Laura-Rachel elabora quadri culturali e narrativi per grandi Maison, tra cui Cartier, Chopard e De Beers. Il suo lavoro si radica in una narrazione fondata sulla ricerca, in cui il marketing è inteso come disciplina culturale, capace di trasmettere patrimonio, significato e immaginazione al più alto livello dell'ecosistema del lusso.",
"Narrative Strategy": "Strategia narrativa",
"An expert in storytelling as a tool of projection and desire, she conceives narratives designed to make audiences dream while remaining anchored in intellectual rigour and historical depth.\n\nThrough immersive experiences, films, open-world digital environments, and long-form narratives, she contributes to expanding how luxury articulates itself, extending the language of art into contemporary luxury culture.": "Esperta di storytelling come strumento di proiezione e di desiderio, concepisce narrazioni destinate a far sognare il pubblico, restando ancorate al rigore intellettuale e alla profondità storica.\n\nAttraverso esperienze immersive, film, ambienti digitali open-world e narrazioni di ampio respiro, contribuisce ad ampliare il modo in cui il lusso si esprime, estendendo il linguaggio dell'arte alla cultura contemporanea del lusso.",
"An Independent Practice": "Una pratica indipendente",
"Alongside this strategic dimension, Laura-Rachel maintains an independent artistic practice as a writer and visual artist.\n\nHer work explores the tangible heritage of objects and the intangible heritage of narratives, engaging with themes of time, metamorphosis, cosmology, and the sublime.\n\nHer interdisciplinary approach draws on ancient myths, symbolic systems, and material history, translating complex cultural structures into visual and textual forms.": "Accanto a questa dimensione strategica, Laura-Rachel coltiva una pratica artistica indipendente come scrittrice e artista visiva.\n\nIl suo lavoro esplora il patrimonio tangibile degli oggetti e quello intangibile dei racconti, confrontandosi con i temi del tempo, della metamorfosi, della cosmologia e del sublime.\n\nIl suo approccio interdisciplinare attinge ai miti antichi, ai sistemi simbolici e alla storia materiale, traducendo strutture culturali complesse in forme visive e testuali.",

function useReveal(count, delay = 80) {
  const [visible, setVisible] = useState([]);
  useEffect(() => { setVisible([]); const t = Array.from({ length: count }, (_, i) => setTimeout(() => setVisible(v => [...v, i]), 200 + i * delay)); return () => t.forEach(clearTimeout); }, [count, delay]);
  return visible;
}

function PdfViewer({ url }) {
  const boxRef = React.useRef(null);
  const [pages, setPages] = useState(null);
  const [failed, setFailed] = useState(false);
  const docRef = React.useRef(null);
  useEffect(() => {
    let cancelled = false;
    const lib = window.pdfjsLib;
    if (!lib) { setFailed(true); return; }
    lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    lib.getDocument(url).promise.then(async doc => {
      if (cancelled) return;
      docRef.current = doc;
      const first = await doc.getPage(1);
      const vp = first.getViewport({ scale: 1 });
      const box = boxRef.current;
      const portrait = vp.height > vp.width;
      const w = Math.min((box ? box.clientWidth : 900) - 96, portrait ? 760 : 1100);
      setPages({ n: doc.numPages, w, ratio: vp.height / vp.width });
    }).catch(() => setFailed(true));
    return () => { cancelled = true; if (docRef.current) docRef.current.destroy(); };
  }, [url]);
  useEffect(() => {
    if (!pages || !boxRef.current) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const obs = new IntersectionObserver(entries => entries.forEach(en => {
      const el = en.target;
      if (!en.isIntersecting || el.dataset.done) return;
      el.dataset.done = '1';
      docRef.current.getPage(+el.dataset.p).then(page => {
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: pages.w / base.width * dpr });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        c.style.cssText = 'width:100%;height:auto;display:block';
        page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(() => { el.style.height = 'auto'; el.innerHTML = ''; el.appendChild(c); });
      });
    }), { root: boxRef.current, rootMargin: '1200px 0px' });
    boxRef.current.querySelectorAll('[data-p]').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, [pages]);
  return (
    <div ref={boxRef} style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: '40px 48px 56px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '28px' }}>
      {failed && <a href={url} target="_blank" rel="noopener noreferrer" style={{ fontFamily: "'Outfit',sans-serif", fontSize: '10.5px', letterSpacing: '2.5px', textTransform: 'uppercase', color: '#2c2622', borderBottom: '1px solid #2c2622', paddingBottom: '3px', textDecoration: 'none', marginTop: '40px' }}>{tr("Open the document")} →</a>}
      {!pages && !failed && <p style={{ fontFamily: "'Outfit',sans-serif", fontSize: '10px', letterSpacing: '3px', textTransform: 'uppercase', color: '#8a8078', marginTop: '40px' }}>Loading…</p>}
      {pages && Array.from({ length: pages.n }, (_, i) => (
        <div key={i} data-p={i + 1} style={{ width: pages.w + 'px', maxWidth: '100%', height: Math.round(pages.w * pages.ratio) + 'px', background: '#fff', boxShadow: '0 10px 36px rgba(44,38,34,0.16)', flexShrink: 0 }} />
      ))}
    </div>
  );
}

  const parts = text.split(/(<\/?i>)/);
  let it = false; const out = [];
  parts.forEach((t, k) => { if (t === '<i>') it = true; else if (t === '</i>') it = false; else if (t) out.push(it ? <em key={k}>{t}</em> : <React.Fragment key={k}>{t}</React.Fragment>); });
  return out;
}

function RichText({ text }) {
  return text.split('\n\n').map((p, i) => {
    if (p.startsWith('## ')) return <h3 key={i} style={{ fontFamily: "'EB Garamond',serif", fontSize: '24px', fontWeight: 400, fontStyle: 'italic', color: '#2c2622', margin: '48px 0 20px', lineHeight: 1.3 }}><Inline text={p.slice(3)} /></h3>;
    if (p.startsWith('**')) return <p key={i} style={{ fontFamily: "'Outfit',sans-serif", fontSize: '15px', lineHeight: 1.9, fontWeight: 500, color: '#2c2622', margin: '32px 0 16px' }}><Inline text={p.slice(2)} /></p>;
    return <p key={i} style={{ fontFamily: "'Outfit',sans-serif", fontSize: '15px', lineHeight: 2, fontWeight: 300, color: '#3a3430', margin: '0 0 24px', textAlign: 'justify', hyphens: 'auto' }}><Inline text={p} /></p>;
  });
}

function ArticleModal({ article, onClose }) {

  }, []);
  const [loaded, setLoaded] = useState(null);
  useEffect(() => { if (article.textFile) fetch(article.textFile).then(r => r.text()).then(setLoaded).catch(() => {}); }, [article.textFile]);

    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(5,8,18,0.35)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)' }}>

          <h2 style={{ fontFamily: "'EB Garamond',serif", fontSize: '34px', fontWeight: 400, color: '#2c2622', margin: '0 0 40px', lineHeight: 1.25 }}>{article.title}</h2>

          {article.image && <img src={article.image} style={{ display: 'block', width: '100%', height: 'auto', margin: '0 0 40px' }} />}
          {body
            ? <RichText text={body} />

              ? <p style={{ fontFamily: "'Outfit',sans-serif", fontSize: '10px', letterSpacing: '3px', textTransform: 'uppercase', color: '#8a8078' }}>Loading…</p>
            : article.url
              ? <p style={{ fontFamily: "'EB Garamond',serif", fontSize: '18px', color: '#58504a', fontStyle: 'italic', margin: '0 0 24px' }}>{tr("Published in")} {article.publication}, {tr(article.period)}.</p>
              : <p style={{ fontFamily: "'EB Garamond',serif", fontSize: '18px', color: '#a69e94', fontStyle: 'italic' }}>{tr("Text coming soon.")}</p>
          }
        </div>}

function App() {
  const [page, setPage] = useState("Profile");
  const [pdfUrl, setPdfUrl] = useState(null);
  const [pdfLabel, setPdfLabel] = useState('');
  const [lang, setLang] = useState(() => { try { return localStorage.getItem('lang') || 'en'; } catch (e) { return 'en'; } });

  return (

      {pdfUrl && <PdfModal url={pdfUrl} label={pdfLabel} onClose={() => setPdfUrl(null)} />}

        {page === "Profile" && <Profile />}
        {page === "Direction" && <CreativeDirection onPdf={(url, label) => { setPdfUrl(url); setPdfLabel(label); }} />}
        {page === "Research" && <WritingResearch onPdf={(url, label) => { setPdfUrl(url); setPdfLabel(label); }} />}
        {page === "Writing" && <TextsEssays />}

      </footer>
    </div>
    </LangContext.Provider>
  );
}

  <script>
  (function(){
    function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
    function lerpColor(c1, c2, t) {
      return 'rgb('+lerp(c1[0],c2[0],t)+','+lerp(c1[1],c2[1],t)+','+lerp(c1[2],c2[2],t)+')';
    }
    function lerpColorA(c1, c2, a1, a2, t) {
      return 'rgba('+lerp(c1[0],c2[0],t)+','+lerp(c1[1],c2[1],t)+','+lerp(c1[2],c2[2],t)+','+(a1+(a2-a1)*t).toFixed(2)+')';
    }

    // Night → Day
    const BG_NIGHT   = [4, 12, 26];
    const BG_DAY     = [237, 229, 216];
    const CARD_NIGHT = [8, 18, 40];
    const CARD_DAY   = [250, 248, 245];
    const TXT_NIGHT  = [200, 190, 170];
    const TXT_DAY    = [44, 38, 34];
    const NAV_NIGHT  = [4, 12, 26];
    const NAV_DAY    = [237, 229, 216];

    function applyTheme(t) {
      if (document.getElementById('paper-bg')) return;
      if (document.getElementById('paper-bg')) return; // Writing page — skip
      // ease
      const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

      document.body.style.background = lerpColor(BG_NIGHT, BG_DAY, e);

      const nav = document.querySelector('nav');
      if (nav) nav.style.removeProperty('background');

      // Nav buttons seulement
      document.querySelectorAll('nav button, nav span, nav a').forEach(el => {
        el.style.color = lerpColor([210,200,180], [44,38,34], e);
      });

      // bg image opacity — plus visible la nuit
      const bgStyle = document.querySelector('style[id="bg-style"]');
      // handled via pseudo-element opacity in stylesheet

      // Curseur — bleu la nuit, bleu nuit le jour
      const cp = document.getElementById('cp');
      if (cp) cp.setAttribute('stroke', '#002B7F');

      // Zone jour — apparaît à partir de 40% du scroll
      const dayZone = document.getElementById('day-zone');
      if (dayZone) dayZone.style.opacity = Math.max(0, (e - 0.4) / 0.6).toFixed(2);

      // Toutes les cartes — couleur texte seulement, pas le fond
      document.querySelectorAll('.content-card').forEach(card => {
        card.style.removeProperty('background');
        card.style.removeProperty('box-shadow');
      });
    }

    let ticking = false;
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() {
          const maxScroll = document.body.scrollHeight - window.innerHeight;
          const t = maxScroll > 0 ? Math.min(window.scrollY / maxScroll, 1) : 0;
          applyTheme(t);
          ticking = false;
        });
        ticking = true;
      }
    }, {passive:true});

    // Init — nuit
    applyTheme(0);
  })();
  </script>

  <style>

    @keyframes night-fade { from { opacity: 1; } to { opacity: 0; } }
    @keyframes day-fade   { from { opacity: 0; } to { opacity: 1; } }
    #night-panel {

    #day-zone {

  })();
  </script>
